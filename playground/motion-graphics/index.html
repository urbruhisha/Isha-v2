<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Motion</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;

      padding: 30px;

      background: #fffaf0;
    }

    video {
      display: block;

      width: 100%;
      max-width: 1000px;
      max-height: 100%;

      border-radius: 10px;
    }

  </style>

</head>


<body>

  <video
    controls
    playsinline
  >
    <source
      src="motion.mp4"
      type="video/mp4"
    >

    Your browser does not support video playback.

  </video>

</body>

</html>
